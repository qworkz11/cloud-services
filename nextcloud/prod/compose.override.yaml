version: "3.8"

networks:
  traefik:
    external: true

volumes:
  nextcloud-data:
    name: nextcloud-data
    driver: local
  nextcloud-db-data:
    name: nextcloud-db-data
    driver: local

services:
  nextcloud:
    image: $DOCKER_NEXTCLOUD_IMAGE
    container_name: nextcloud
    hostname: nextcloud
    networks:
      - traefik
    volumes:
      - nextcloud-data:/var/www/html
    environment:
      - MYSQL_USER=$MYSQL_USER
      - MYSQL_PASSWORD=$MYSQL_PASSWORD
      - NEXTCLOUD_ADMIN_USER=$NEXTCLOUD_ADMIN
      - NEXTCLOUD_ADMIN_PASSWORD=$NEXTCLOUD_ADMIN_PASSWORD
      - NEXTCLOUD_TRUSTED_DOMAINS=$NEXTCLOUD_HOST
      - OVERWRITEHOST=$NEXTCLOUD_HOST
      - OVERWRITEPROTOCOL=https
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`$NEXTCLOUD_HOST`)
      - traefik.http.routers.nextcloud.service=nextcloud-service
      - traefik.http.services.nextcloud-service.loadbalancer.server.port=80
      - traefik.http.routers.nextcloud.entrypoints=websecure

  nextcloud-cron:
    image: $DOCKER_NEXTCLOUD_IMAGE
    networks:
      - traefik
    volumes:
      - nextcloud-data:/var/www/html
    environment:
      - MYSQL_USER=$MYSQL_USER
      - MYSQL_PASSWORD=$MYSQL_PASSWORD
      - NEXTCLOUD_ADMIN_USER=$NEXTCLOUD_ADMIN
      - NEXTCLOUD_ADMIN_PASSWORD=$NEXTCLOUD_ADMIN_PASSWORD
      - NEXTCLOUD_TRUSTED_DOMAINS=$NEXTCLOUD_HOST
      - OVERWRITEHOST=$NEXTCLOUD_HOST
      - OVERWRITEPROTOCOL=https

  nextcloud-db:
    image: $DOCKER_MYSQL_IMAGE
    container_name: nextcloud-db
    networks:
      - traefik
    volumes:
      - nextcloud-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
      - MYSQL_PASSWORD=$MYSQL_PASSWORD
      - MYSQL_USER=$MYSQL_USER

  nextcloud-cache:
    image: $DOCKER_REDIS_IMAGE
    networks:
      - traefik

  nextcloud-collabora:
    container_name: nextcloud-collabora
    image: $DOCKER_COLLABORA_IMAGE
    restart: unless-stopped
    networks:
      - traefik
    environment:
      - domain=$NEXTCLOUD_HOST
      - aliasgroup1=$COLLABORA_ALIAS_GROUP_1
      - dictionaries=en_GB en_US de_DE
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true # SSH enabled through traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud-collabora.rule=Host(`$COLLABORA_HOST`)
      - traefik.http.routers.nextcloud-collbara.service=nextcloud-collabora-service
      - traefik.http.services.nextcloud-collabora-service.loadbalancer.server.port=9980
      - traefik.http.routers.nextcloud-collabora.entrypoints=websecure
    
      